name: Java Test Coverage with Maven, Coveralls

on:
    workflow_dispatch:
        inputs:
            test-filter:
                description: 'Optional surefire -Dtest filter (empty runs the full suite)'
                required: false
                default: ''

env:
    MAVEN_OPTS: -Xmx4g -Xms1g

jobs:
    build:
        name: Build, Test, Coverage
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
          fail-fast: false
          matrix:
              jdk: [ 8,9,11,12,13 ]

        env:
          JDK_VERSION: ${{ matrix.jdk }}

        steps:
        - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
          uses: actions/checkout@v4
          with:
              persist-credentials: false

        - name: Cache local Maven repository
          uses: actions/cache@v4
          with:
              path: ~/.m2/repository
              key: build-${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
              restore-keys: build-${{ runner.os }}-maven-

        - name: Install Matrix JDK
          uses: actions/setup-java@v4
          with:
              java-version: ${{ matrix.jdk }}
              distribution: zulu
              architecture: x64

        - name: Echo Java Version
          run: >
              java -version

        - name: Test
          env:
              TEST_FILTER: ${{ inputs.test-filter }}
          run: |
              if [ -n "$TEST_FILTER" ]; then
                FILTER_ARGS="-Dtest=$TEST_FILTER -Dsurefire.failIfNoSpecifiedTests=false"
              else
                FILTER_ARGS=""
              fi
              mvn clean test \
                -Dmaven.javadoc.skip=true \
                -Dgpg.skip=true \
                $FILTER_ARGS \
                --toolchains .github/workflows/.toolchains.xml

        - name: Print skipped tests
          if: always()
          run: |
              python3 - <<'EOF'
              import glob, xml.etree.ElementTree as ET
              seen = {}
              for f in glob.glob('target/surefire-reports/**/TEST-*.xml', recursive=True):
                  for tc in ET.parse(f).getroot().iter('testcase'):
                      sk = tc.find('skipped')
                      if sk is not None:
                          key = (tc.get('classname'), tc.get('name'))
                          seen[key] = sk.get('message') or (sk.text or '').strip() or 'no message'
              print(f"Skipped tests: {len(seen)}")
              for (c, n), m in sorted(seen.items()):
                  print(f"SKIPPED {c}.{n}: {m}")
              EOF

        - name: Install Dependencies
          run: >
              mvn clean install -B -V -q
              -DskipTests=true
              -Dgpg.skip=true
              -Drat.skip=true
              --toolchains .github/workflows/.toolchains.xml

        - name: Upload jars
          if: ${{ matrix.jdk == 8 }}
          uses: actions/upload-artifact@v4
          with:
              name: datasketches-java-jars
              path: |
                  target/datasketches-java-*.jar
                  !target/datasketches-java-*-sources.jar
                  !target/datasketches-java-*-test-sources.jar
                  !target/datasketches-java-*-javadoc.jar
              if-no-files-found: error
